name: cinetrack
description: CineTrack — приложение для отслеживания фильмов, сериалов и мультфильмов.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # UI
  table_calendar: ^3.1.2
  fl_chart: ^0.69.0
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.4.1

  # Utils
  intl: ^0.20.3
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.3
  http: ^1.6.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
